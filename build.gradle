plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// O pacote raiz do código é `src.raiz`, por isso a raiz dos fontes é o próprio diretório do projeto.
// O compilador não tem dependências, e o lexer e o parser gerados ficam commitados, então também compila sem o
// Gradle, só com o JDK: javac -d out $(find src -name '*.java')
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include 'src/raiz/**'
        }
    }
    test {
        java {
            srcDirs = ['tests/java']
        }
    }
    // O gerador das tabelas da gramática, usado só pelo gerarAnalisadores
    ferramentas {
        java {
            srcDirs = ['ferramentas']
        }
    }
}

application {
    mainClass = 'src.raiz.Main'
}

jar {
    archiveFileName = 'cafezinho.jar'
    manifest {
        attributes 'Main-Class': 'src.raiz.Main'
    }
}

// Geração do lexer e do parser. É manual, fora do build: o código gerado fica commitado, e assim compilar e testar
// não precisam do Bison. Rode depois de mudar o lexer.flex ou o parser.y:
//
//   ./gradlew gerarAnalisadores
//
// O JFlex vem do Maven Central. O Bison precisa estar instalado, na versão 3.7 ou mais nova: o do macOS é o 2.3,
// que não gera Java, e o do Homebrew (brew install bison) não entra no PATH, então é procurado primeiro. Outro
// caminho: ./gradlew gerarAnalisadores -Pbison=/caminho/bison
def analisadoresSaida = 'src/raiz/generated'
// A gramática exportada pelo Bison, de onde saem os números dos tokens e os conjuntos FIRST
def gramaticaXml = 'build/bison/parser.xml'
def bison = providers.gradleProperty('bison').getOrElse(
        ['/opt/homebrew/opt/bison/bin/bison', '/usr/local/opt/bison/bin/bison'].find { new File(it).exists() } ?: 'bison'
)

configurations {
    jflex
}

dependencies {
    jflex 'de.jflex:jflex:1.9.1'
}

tasks.register('gerarLexer', JavaExec) {
    group = 'geração'
    description = 'Gera o Lexer.java a partir do lexer.flex'
    classpath = configurations.jflex
    mainClass = 'jflex.Main'
    // Caminhos relativos, para os comentários no código gerado não dependerem da máquina
    workingDir = projectDir
    args '-d', analisadoresSaida, '--nobak', 'lexer.flex'
}

tasks.register('gerarParser', Exec) {
    group = 'geração'
    description = 'Gera o Parser.java a partir do parser.y'
    workingDir = projectDir
    commandLine bison, '-Wcounterexamples', "--xml=$gramaticaXml", '-o', "$analisadoresSaida/Parser.java", 'parser.y'
    doFirst {
        def versao
        try {
            versao = providers.exec { commandLine bison, '--version' }.standardOutput.asText.get().readLines().first()
        } catch (Exception ignored) {
            throw new GradleException("Bison não encontrado em '$bison'. Instale com brew install bison ou apt install bison")
        }
        if (!(versao ==~ /.* 3\.([7-9]|[1-9][0-9]).*/)) {
            throw new GradleException("Precisa do Bison 3.7 ou mais novo, encontrado: $versao")
        }
        file(gramaticaXml).parentFile.mkdirs()
    }
}

tasks.register('gerarTabelas', JavaExec) {
    group = 'geração'
    description = 'Gera o TabelasGramatica.java a partir da gramática exportada pelo Bison'
    dependsOn 'gerarParser'
    classpath = sourceSets.ferramentas.runtimeClasspath
    mainClass = 'GeradorTabelasGramatica'
    workingDir = projectDir
    args gramaticaXml, "$analisadoresSaida/TabelasGramatica.java"
}

tasks.register('gerarAnalisadores') {
    group = 'geração'
    description = 'Gera o lexer, o parser e as tabelas da gramática'
    dependsOn 'gerarLexer', 'gerarTabelas'
}

// Simulador MARS usado pelos testes para executar o assembly gerado
def marsUrl = 'https://github.com/dpetersanderson/MARS/releases/download/v.4.5.1/Mars4_5.jar'
def marsSha256 = 'ac340b676ba2b62246b9df77e62f81ad4447bcfd329ab539716bcd09950b7096'
def marsJar = layout.buildDirectory.file('ferramentas/Mars4_5.jar')

tasks.register('baixarMars') {
    description = 'Baixa o simulador MARS usado nos testes'
    outputs.file(marsJar)
    doLast {
        def arquivo = marsJar.get().asFile
        arquivo.parentFile.mkdirs()
        new URI(marsUrl).toURL().withInputStream { entrada ->
            arquivo.withOutputStream { saida -> saida << entrada }
        }
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(arquivo.bytes).encodeHex().toString()
        if (hash != marsSha256) {
            arquivo.delete()
            throw new GradleException("SHA-256 inesperado para o MARS: $hash")
        }
    }
}

test {
    useJUnitPlatform()
    dependsOn 'baixarMars'
    systemProperty 'cafezinho.mars', marsJar.get().asFile.absolutePath
    systemProperty 'cafezinho.testes', file('tests').absolutePath
    inputs.dir('tests')
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
